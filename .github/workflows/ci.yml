name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Gradle test
        run: ./gradlew test

      - name: Assemble Android Debug
        run: ./gradlew :androidApp:assembleDebug

      - name: Prepare APK artifact
        run: cp androidApp/build/outputs/apk/debug/androidApp-debug.apk Sencha-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sencha-debug-${{ github.ref_name }}-${{ github.sha }}
          path: Sencha-debug.apk
